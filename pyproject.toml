[project]
name = "inference-engine"
version = "0.1.0"
description = "Phase 1: host a model, KV cache, continuous batching"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "safetensors>=0.4",
    "huggingface_hub>=0.25",
    "transformers>=4.51",
    "tokenizers>=0.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q"

[tool.setuptools]
packages = ["engine", "bench", "figures"]

[tool.setuptools.package-data]
engine = ["static/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
