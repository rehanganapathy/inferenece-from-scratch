<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inference-engine</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --fg: #1c1917; --muted: #78716c;
    --line: #e7e5e4; --accent: #2563eb; --user: #eff6ff; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --panel: #1c1917; --fg: #f5f5f4; --muted: #a8a29e;
      --line: #292524; --accent: #60a5fa; --user: #172554; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #stats { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  #stats .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 5px; }
  #stats.up .dot { background: #16a34a; }
  header .spacer { flex: 1; }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }

  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin: 0 0 18px; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .msg .body { white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .body { background: var(--user); padding: 10px 14px; border-radius: 12px; display: inline-block; max-width: 100%; }
  .msg .meta { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); margin-top: 6px; }
  .msg.err .body { color: var(--err); }
  .think { color: var(--muted); font-style: italic; }
  .empty { color: var(--muted); text-align: center; margin-top: 15vh; }

  form { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-height: 44px; max-height: 200px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .opts { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); align-items: center; }
  .opts label { display: flex; gap: 6px; align-items: center; }
  .opts input[type=number] {
    width: 64px; font: inherit; padding: 2px 6px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
</style>
</head>
<body>
<header>
  <h1>inference-engine</h1>
  <span id="stats"><span class="dot"></span>connecting…</span>
  <span class="spacer"></span>
  <button id="clear" type="button">Clear</button>
</header>

<main id="log"><div class="wrap" id="msgs"><p class="empty">Qwen3-0.6B, served by this engine. Say something.</p></div></main>

<form id="form">
  <div class="wrap">
    <div class="row">
      <textarea id="input" rows="1" placeholder="Message  (Enter to send, Shift+Enter for newline)" autofocus></textarea>
      <button id="send" class="primary" type="submit">Send</button>
    </div>
    <div class="opts">
      <label>temperature <input id="temp" type="number" min="0" max="2" step="0.1" value="0.7"></label>
      <label>top_p <input id="topp" type="number" min="0" max="1" step="0.05" value="0.9"></label>
      <label>max_tokens <input id="maxt" type="number" min="1" max="2048" step="1" value="512"></label>
      <label><input id="think" type="checkbox"> thinking</label>
    </div>
  </div>
</form>

<script>
const $ = (id) => document.getElementById(id);
const msgs = $("msgs"), log = $("log"), input = $("input"), send = $("send");
let history = [];          // [{role, content}] sent to /v1/chat/completions
let controller = null;     // AbortController for the in-flight stream

function addMsg(role, text = "") {
  msgs.querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="who">${role === "user" ? "you" : role === "err" ? "error" : "qwen3"}</div><div class="body"></div>`;
  el.querySelector(".body").textContent = text;
  msgs.appendChild(el);
  scroll();
  return el;
}

function scroll() {
  if (log.scrollHeight - log.scrollTop - log.clientHeight < 120) log.scrollTop = log.scrollHeight;
}

// Show <think>...</think> dimmed, the rest as plain text. textContent only, never innerHTML.
function render(body, text) {
  body.replaceChildren();
  const m = text.match(/^\s*<think>([\s\S]*?)(<\/think>|$)([\s\S]*)$/);
  if (!m) { body.textContent = text; return; }
  const t = document.createElement("div");
  t.className = "think";
  t.textContent = m[1].trim();
  body.append(t);
  if (m[3]) body.append(document.createTextNode("\n" + m[3].trimStart()));
}

function stripThink(text) {
  return text.replace(/^\s*<think>[\s\S]*?<\/think>\s*/, "");
}

async function chat(userText) {
  history.push({ role: "user", content: userText });
  addMsg("user", userText);
  const el = addMsg("assistant");
  const body = el.querySelector(".body");
  const meta = document.createElement("div");
  meta.className = "meta";
  el.appendChild(meta);

  controller = new AbortController();
  setBusy(true);
  let text = "", n = 0, t0 = performance.now(), tFirst = null, finish = null;

  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        messages: history, stream: true,
        temperature: +$("temp").value, top_p: +$("topp").value,
        max_tokens: +$("maxt").value, enable_thinking: $("think").checked,
      }),
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `HTTP ${r.status}`);

    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 2);
        if (!line.startsWith("data: ") || line === "data: [DONE]") continue;
        const choice = JSON.parse(line.slice(6)).choices[0];
        if (choice.delta.content) {
          tFirst ??= performance.now();
          text += choice.delta.content;
          n++;
          render(body, text);
          scroll();
        }
        if (choice.finish_reason) finish = choice.finish_reason;
      }
      const secs = tFirst ? (performance.now() - tFirst) / 1000 : 0;
      meta.textContent = `${n} chunks · ${secs > 0 ? (n / secs).toFixed(1) : "–"} tok/s`;
    }
    const ttft = tFirst ? Math.round(tFirst - t0) : 0;
    const secs = tFirst ? (performance.now() - tFirst) / 1000 : 0;
    meta.textContent = `${n} tokens · ${secs > 0 ? (n / secs).toFixed(1) : "–"} tok/s · ${ttft} ms to first token · ${finish ?? "?"}`;
  } catch (e) {
    if (e.name === "AbortError") meta.textContent = `stopped after ${n} tokens`;
    else { el.className = "msg err"; body.textContent = String(e.message || e); history.pop(); }
  } finally {
    if (text) history.push({ role: "assistant", content: stripThink(text) });
    controller = null;
    setBusy(false);
  }
}

function setBusy(busy) {
  send.textContent = busy ? "Stop" : "Send";
  send.classList.toggle("primary", !busy);
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (controller) { controller.abort(); return; }
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  grow();
  chat(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
const grow = () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; };
input.addEventListener("input", grow);

$("clear").addEventListener("click", () => {
  controller?.abort();
  history = [];
  msgs.innerHTML = '<p class="empty">Cleared.</p>';
  input.focus();
});

async function pollStats() {
  const el = $("stats");
  try {
    const s = await (await fetch("/stats")).json();
    el.className = "up";
    el.innerHTML = '<span class="dot"></span>';
    el.append(`${s.device} · ${s.dtype.replace("torch.", "")} · running ${s.running} · waiting ${s.waiting} · KV ${s.kv_pool_gb} GB`);
  } catch {
    el.className = "";
    el.innerHTML = '<span class="dot"></span>server unreachable';
  }
}
pollStats();
setInterval(pollStats, 2000);
</script>
</body>
</html>
